services:
  deposits-db:
    image: postgres:16-alpine
    container_name: deposits-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: deposits
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d deposits"]
      interval: 3s
      timeout: 5s
      retries: 10
    networks:
      - backend

  minio:
    image: minio/minio
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - backend

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6280:6379"      # Хостовый 6280, внутри контейнера 6379
    networks:
      - backend

  deposits-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deposits-app
    depends_on:
      deposits-db:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_started
    environment:
      DB_HOST: deposits-db
      DB_PORT: 5432
      DB_USER: user
      DB_PASSWORD: password
      DB_NAME: deposits
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: deposits
      REDIS_HOST: redis
      REDIS_PORT: 6379   # Для контейнеров ВСЕГДА 6379!
      JWT_SECRET: my-super-secret-jwt-key-change-in-production
      PORT: 3001
    ports:
      - "3001:3001"
    restart: on-failure
    networks:
      - backend

  adminer:
    image: adminer
    container_name: adminer
    ports:
      - "8080:8080"
    depends_on:
      - deposits-db
    environment:
      ADMINER_DEFAULT_SERVER: deposits-db
    networks:
      - backend

volumes:
  pg_data:
  minio_data:

networks:
  backend:
    driver: bridge
