<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Калькулятор вкладов</title>
    <link rel="stylesheet" href="/static/styles/list_style.css">
</head>
<body>
    <header>
        <h1>КАЛЬКУЛЯТОР ПРОЦЕНТОВ ПО ВКЛАДАМ</h1>
    </header>

    <div class="header-bar">
        <form action="/" method="GET">
            <input type="text" name="query" placeholder="Поиск..." value="{{ .query }}">
            <button type="submit">Найти</button>
        </form>

        <a href="/deposit-request/1" class="btn btn-cart" aria-label="Корзина">
            <img src="/static/img/basket.png" alt="Cart" class="cart-icon">
            {{ if gt .cartCount 0 }}
            <span class="cart-count">{{ .cartCount }}</span>
            {{ end }}
        </a>
    </div>

    <h2 class="catalog-title">Банковские месяцы</h2>
    <p class="catalog-subtitle">Рассчитайте проценты по вкладу для каждого месяца</p>

    <div class="months-grid">
        {{ range .months }}
        <div class="month-card">
            <img src="/static/img/{{ .Image }}" alt="{{ .Name }}">
            <h2>{{ .Name }}</h2>
            <p>Дней: {{ .Days }} | Ставка: {{ .InterestRate }}</p>
            <div>
                <a href="/month/{{ .ID }}"><button>Подробнее</button></a>
            </div>
        </div>
        {{ end }}
    </div>
</body>
</html>
