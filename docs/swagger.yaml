basePath: /api
definitions:
  models.AuthResponse:
    properties:
      token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      user:
        $ref: '#/definitions/models.User'
    type: object
  models.LoginRequest:
    properties:
      email:
        example: user@example.com
        type: string
      password:
        example: password123
        type: string
    required:
    - email
    - password
    type: object
  models.RegisterRequest:
    properties:
      email:
        example: user@example.com
        type: string
      name:
        example: John Doe
        type: string
      password:
        example: password123
        minLength: 6
        type: string
    required:
    - email
    - password
    type: object
  models.Request:
    properties:
      created_at:
        type: string
      id:
        type: integer
      services:
        items:
          $ref: '#/definitions/models.RequestService'
        type: array
      status:
        type: string
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
  models.RequestService:
    properties:
      quantity:
        type: integer
      request_id:
        type: integer
      service:
        $ref: '#/definitions/models.Service'
      service_id:
        type: integer
    type: object
  models.Service:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      image_url:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      price:
        type: number
    type: object
  models.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      role:
        description: user, moderator, guest
        type: string
    type: object
host: localhost:3001
info:
  contact: {}
  description: API для управления заявками и услугами с JWT авторизацией и Redis
  title: Deposits API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return JWT token
      parameters:
      - description: Login credentials
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/models.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AuthResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login user
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user account
      parameters:
      - description: User registration data
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/models.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.AuthResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new user
      tags:
      - auth
  /requests:
    get:
      description: Get requests (user sees only own, moderator sees all)
      parameters:
      - description: Filter by date from
        in: query
        name: date_from
        type: string
      - description: Filter by date to
        in: query
        name: date_to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Request'
            type: array
      security:
      - BearerAuth: []
      summary: Get list of requests
      tags:
      - requests
  /requests/{id}:
    get:
      description: Get specific request (user can only see own, moderator sees all)
      parameters:
      - description: Request ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Request'
      security:
      - BearerAuth: []
      summary: Get request by ID
      tags:
      - requests
  /requests/{id}/complete:
    put:
      description: Complete request (moderator only)
      parameters:
      - description: Request ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Complete request
      tags:
      - requests
  /requests/{id}/delete:
    post:
      description: Logically delete request
      parameters:
      - description: Request ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete request
      tags:
      - requests
  /requests/{id}/services/{service_id}/quantity:
    put:
      consumes:
      - application/json
      description: Update quantity of service in request
      parameters:
      - description: Request ID
        in: path
        name: id
        required: true
        type: integer
      - description: Service ID
        in: path
        name: service_id
        required: true
        type: integer
      - description: New quantity
        in: body
        name: input
        required: true
        schema:
          properties:
            quantity:
              type: integer
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update service quantity in request
      tags:
      - requests
  /requests/{id}/submit:
    put:
      description: Submit draft request (change status to formed)
      parameters:
      - description: Request ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Submit request
      tags:
      - requests
  /requests/add-service:
    post:
      consumes:
      - application/json
      description: Add service to user's draft request
      parameters:
      - description: Service ID
        in: body
        name: input
        required: true
        schema:
          properties:
            service_id:
              type: integer
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Add service to draft
      tags:
      - requests
  /requests/draft:
    get:
      description: Get or create draft request for current user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Request'
      security:
      - BearerAuth: []
      summary: Get draft request
      tags:
      - requests
  /requests/remove-service:
    delete:
      consumes:
      - application/json
      description: Remove service from request
      parameters:
      - description: Request and Service IDs
        in: body
        name: input
        required: true
        schema:
          properties:
            request_id:
              type: integer
            service_id:
              type: integer
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Remove service from request
      tags:
      - requests
  /services:
    get:
      description: Get all active services with optional search
      parameters:
      - description: Search query
        in: query
        name: query
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Service'
            type: array
      security:
      - BearerAuth: []
      summary: Get list of services
      tags:
      - services
    post:
      consumes:
      - application/json
      description: Create a new service (moderator only)
      parameters:
      - description: Service data
        in: body
        name: input
        required: true
        schema:
          properties:
            name:
              type: string
            price:
              type: number
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Service'
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create a new service
      tags:
      - services
  /services/{id}:
    delete:
      description: Delete service (moderator only)
      parameters:
      - description: Service ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete service
      tags:
      - services
    put:
      consumes:
      - application/json
      description: Update service details (moderator only)
      parameters:
      - description: Service ID
        in: path
        name: id
        required: true
        type: integer
      - description: Service data
        in: body
        name: input
        required: true
        schema:
          properties:
            name:
              type: string
            price:
              type: number
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update service
      tags:
      - services
  /services/{id}/image:
    post:
      consumes:
      - multipart/form-data
      description: Upload image for service (moderator only)
      parameters:
      - description: Service ID
        in: path
        name: id
        required: true
        type: integer
      - description: Image file
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Upload service image
      tags:
      - services
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
